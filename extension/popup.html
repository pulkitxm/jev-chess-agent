</style></head><body><h1>Jev Chess Agent</h1><p>Start a fresh bot game, then connect. Jev chooses every move.</p><label for="pairing">Local pairing code</label><input id="pairing" type="password" placeholder="From the local dashboard" autocomplete="off"><label for="color">My pieces</label><select id="color"><option value="w">White</option><option value="b">Black</option></select><div class="actions"><button id="play">Play automatically</button><button class="secondary" id="step">Play one move</button><button class="secondary" id="stop">Pause</button></div><p id="status" role="status">Ready</p><p id="detail"></p><a href="http://127.0.0.1:4318" target="_blank">Open local dashboard</a><p>Computer bot games only. Chrome shows a debugging banner while browser control is active.</p><script src="popup.js"></script></body></html>
